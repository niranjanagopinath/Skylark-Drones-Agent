<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skylark Intelligence — Business Intelligence Workspace</title>
  <meta name="description" content="Business intelligence workspace over Monday.com deals and work orders, with conversational analysis." />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23217c78'/%3E%3Cpath d='M8 20l5-6 4 3 7-8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app" id="app">
    <div class="backdrop" id="backdrop"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" data-icon="spark" aria-hidden="true"></div>
        <div>
          <div class="brand-name">SKYLARK<span>INTELLIGENCE</span></div>
          <div class="brand-sub">Business Intelligence</div>
        </div>
      </div>

      <nav class="nav" aria-label="Primary">
        <button class="nav-item" data-view="overview"><span data-icon="overview"></span>Overview</button>
        <button class="nav-item" data-view="sales"><span data-icon="sales"></span>Sales</button>
        <button class="nav-item" data-view="operations"><span data-icon="operations"></span>Operations</button>
        <button class="nav-item" data-view="financials"><span data-icon="financials"></span>Financials</button>
        <button class="nav-item" data-view="ask"><span data-icon="ask"></span>Ask</button>

        <div class="nav-label">Data</div>
        <div class="data-card" id="data-card">
          <div class="row">
            <span class="dot stale" id="data-dot"></span>
            <span class="name">Monday.com</span>
          </div>
          <div class="meta" id="data-meta">Connecting…</div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a class="nav-item" id="repo-link" href="#" target="_blank" rel="noopener noreferrer">
          <span data-icon="github"></span>Repository
        </a>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:12px; min-width:0;">
          <button class="hamburger" id="hamburger" aria-label="Toggle navigation"><span data-icon="menu"></span></button>
          <div style="min-width:0;">
            <h1 id="page-title">Overview</h1>
            <div class="desc" id="page-desc">What's happening across the business.</div>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="status-chip" id="top-status"><span class="dot stale" id="top-dot"></span><span id="top-status-text">—</span></span>
          <button class="btn" id="refresh-btn"><span data-icon="refresh"></span>Refresh</button>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
