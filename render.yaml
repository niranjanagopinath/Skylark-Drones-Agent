# Render blueprint. In the Render dashboard: New + -> Blueprint -> pick this repo.
# Then set the two secret env vars (MONDAY_API_TOKEN, ANTHROPIC_API_KEY) which are
# marked sync:false so they are never stored in git.
services:
  - type: web
    name: skylark-bi-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Secrets — set these in the Render dashboard (never stored in git):
      - key: MONDAY_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Non-secret config:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CACHE_TTL_SECONDS
        value: "300"
